<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Generative bell music by Aaron Koppel. Discover a new performance with every Play, then revisit or share the ones that stay with you." />

  <meta property="og:site_name" content="Open" />

  <meta property="og:description" content="Generative bell music by Aaron Koppel. Discover a new performance with every Play, then revisit or share the ones that stay with you." />
  <meta property="og:url" content="https://stereo-images.github.io/open/" />
  <meta property="og:image" content="https://stereo-images.github.io/open/social-preview.png" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=1.0" />
</head>
<body class="launcher">
  <main class="shell" aria-labelledby="launchHeading">
    <h1 id="launchHeading" class="sr-only">Open Audio Player</h1>

    <section class="launchOnly">
      <div class="launch-actions">
        <button type="button" id="launchPlayer" class="btn btn-launch" aria-describedby="desktopHint">Open</button>
      </div>
      <p id="desktopHint" class="hint">Best experienced in a desktop browser.</p>
    </section>
  </main>

  <script>
    (() => {
      function isMobileDevice() {
        const ua = navigator.userAgent || "";
        const isBasicMobile = /iPhone|iPad|iPod|Android/i.test(ua);
        // iPadOS reports its UA as "Macintosh" by default, so the regex above
        // misses real iPads — catch them via touch capability instead. This
        // matches the detection used inside player.js itself.
        const isIPadOS = (navigator.maxTouchPoints > 0) && /Macintosh/i.test(ua);
        return isBasicMobile || isIPadOS;
      }

      function openPlayer() {
        const playerUrl = "player.html" + window.location.search;
        if (isMobileDevice()) {
          // Mobile: same tab
          window.location.href = playerUrl;
          return;
        }
        // Desktop: popout window
        const width = 520, height = 720;
        const left = Math.max(0, (window.screen.width / 2) - (width / 2));
        const top = Math.max(0, (window.screen.height / 2) - (height / 2));
        const playerWindow = window.open(
          playerUrl,
          "open_player",
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=no`
        );
        if (!playerWindow) window.location.href = playerUrl;
      }

      document.getElementById("launchPlayer")?.addEventListener("click", openPlayer);
    })();
  </script>
</body>
</html>
