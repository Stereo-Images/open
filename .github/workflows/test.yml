name: Audio regression checks

on:
  push:
    branches: [main, engineering-hardening, experiment/moving-resonators]
  pull_request:

permissions:
  contents: read

concurrency:
  group: audio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
            projects: --project=chromium --project=firefox
          - os: macos-latest
            browsers: webkit
            projects: --project=webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load original musical baseline
        run: git show 8a2d9c747ce1e31f48753169240c1393a422d028:player.js > "$RUNNER_TEMP/open-baseline.js"
      - name: Run lifecycle and audio-format regressions
        run: npm test
        env:
          OPEN_BASELINE: ${{ runner.temp }}/open-baseline.js
      - name: Install browsers
        run: npx playwright install --with-deps --only-shell ${{ matrix.browsers }}
      - name: Provide a virtual audio output for Linux browsers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=browser_audio
          pactl set-default-sink browser_audio
      - name: Enable keyboard navigation on macOS
        if: runner.os == 'macOS'
        run: defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
      - name: Run native browser checks
        run: npm run test:browser -- ${{ matrix.projects }}
