<!-- player.html (PLAYER PAGE) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open — Player</title>
  <link rel="stylesheet" href="style.css?v=20260916-readout-dimming" />
</head>
<body class="player">
  <main class="shell" aria-label="Audio Instrument">
    <h1 id="playerTitle" class="title-style">Open</h1>

    <section id="controls" aria-label="Controls">
      <form id="songForm" onsubmit="return false;">
        <div class="form-group">
          <label for="songDuration">Length</label>
          <select id="songDuration" name="songDuration">
            <option value="short" selected>Short</option>
            <option value="long">Long</option>
            <option value="infinite">Infinite</option>
          </select>
        </div>

        <div class="form-group tone-group">
          <label id="toneLabel" for="tone">Root Tone<span class="sr-only"> in hertz</span></label>
          <div class="tone-control">
            <div class="tone-dial" id="toneDial">
              <input
                type="range"
                id="tone"
                min="110"
                max="200"
                step="1"
                value="110"
                aria-labelledby="toneLabel"
                aria-describedby="toneHelp"
                aria-orientation="vertical"
                aria-valuetext="110 hertz"
                title="Drag up or down to adjust"
              />
              <span class="tone-dial-face" aria-hidden="true">
                <span class="tone-dial-marker"></span>
              </span>
            </div>
            <div class="tone-readout" aria-hidden="true"><span id="hzReadout">110</span> Hz</div>
            <span id="toneHelp" class="sr-only">Drag up to raise the tone or down to lower it. Use arrow keys for one-hertz steps.</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="playNow" class="btn" aria-pressed="false">Play</button>
          <button type="button" id="stop" class="btn filled" aria-pressed="true">Stop</button>
        </div>
      </form>
    </section>

    <!-- Polite live region for announcements -->
    <div id="playerStatus" class="sr-only" aria-live="polite"></div>

    <footer id="credits" role="contentinfo">
      <div class="credit-line">By Aaron Koppel</div>
      <div class="credit-line">Stereo Images, 2026</div>
    </footer>
  </main>

  <script src="player.js?v=20260922-tail-button-state"></script>
</body>
</html>
